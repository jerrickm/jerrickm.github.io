<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Timer Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="card">

    <header>
      <div class="logo">CT</div>

      <nav>
        <ul class="nav-list">
          <li><a href="jerrickm/jerrickm.github.io/index.html">Assignments</a></li>
          <li>Home</li>
          <li>Profile</li>
        </ul>

        <div class="mobile-toggle">
          <button id="menuBtn">
            Menu <span id="menuArrow">▼</span>
          </button>
        </div>
      </nav>
    </header>

    <div class="mobile-menu" id="mobileMenu">
      <ul>
        <li><a href="jerrickm/jerrickm.github.io/index.html">Assignments</a></li>
        <li>Home</li>
        <li>Profile</li>
      </ul>
    </div>

    <main>

      <div class="controls">
        <button class="tab-btn active" id="ex1Btn">Exercise 1</button>
        <button class="tab-btn" id="ex2Btn">Exercise 2</button>
      </div>

      <!-- Exercise 1 -->
      <section id="ex1" class="panel">
        <h2>How many minutes until class?</h2>

        <div class="slider-row">
          <label for="minutesRange">Minutes:</label>
          <input type="range" id="minutesRange" min="0" max="60" value="20">
          <div id="rangeValue">20</div>
        </div>

        <div class="message">
          <span id="rangeEmoji"></span>
          <span id="rangeText"></span>
        </div>
      </section>

      <!-- Exercise 2 -->
      <section id="ex2" class="panel hidden">
        <h2>Countdown to Class</h2>

        <div class="time-input-row">
          <label for="classTime">Enter Class Time:</label>
          <input type="time" id="classTime">
          <button class="tab-btn" id="updateCount">Start Countdown</button>
        </div>

        <div class="countdown-output">
          <div class="big" id="countMinutes"></div>
          <div id="countMessage"></div>
        </div>
      </section>

    </main>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
