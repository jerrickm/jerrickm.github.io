<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Java Buttons – CSCE 242</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="javabuttons.css">
</head>

<body>

  <header>
    <h1>Java Buttons</h1>
    <p>Introduction to JavaScript</p>
  </header>

  <main class="container">

    <!-- Geometry -->
    <section class="card" id="geometryCard" tabindex="0">
      <h2>Geometry</h2>

      <div class="triangle-container">
        <div class="triangle" id="triangle"></div>
      </div>

      <p class="hint">Click to show the CSS triangle</p>
    </section>

    <!-- Date Picker -->
    <section class="card">
      <h2>Select a Date</h2>

      <input type="date" id="datePicker">
      <p id="dateOutput">No date selected</p>
    </section>

    <!-- Image Change -->
    <section class="card">
      <h2>Image Change</h2>

      <div class="frame">
        <!-- CORRECT PATH -->
        <img
          id="weatherImage"
          src="jerrickm/jerrickm.github.io/Assignments/javabuttons/javabuttonsimg/js9.png"
          alt="Weather image">
      </div>

      <p class="hint">Click the image to change it</p>
    </section>

  </main>

  <footer>
    <a href="/">← Back to Main Page</a>
  </footer>

  <script src="javabuttons.js"></script>
</body>
</html>
